name: Release

# Push a tag like v0.1.0 to publish harper-de.wasm, harper-de.wasm.sha256 and plugin-index.json.
on:
  push:
    tags: ["v*"]
  # A dry run: builds and packages everything, keeps the files as a workflow artifact, publishes nothing.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # It would set RUSTFLAGS, which replaces the wasm flags in .cargo/config.toml.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build, load-test and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="0.0.0-dry-run"; fi
          just test-plugin
          just release-files "$version"
        env:
          HARPER_DE_WASM: target/wasm32-unknown-unknown/release/harper_german.wasm
      - name: Keep the files (dry runs)
        uses: actions/upload-artifact@v4
        with:
          name: harper-de
          path: dist/*
      - name: Publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/harper-de.wasm
            dist/harper-de.wasm.sha256
            dist/plugin-index.json
