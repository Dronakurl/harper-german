name: Latest

# Keeps one rolling release, "latest", holding the harper-de.wasm built from the newest main commit.
# The tag moves and the assets are replaced on every push, so no release history builds up.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: latest
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # It would set RUSTFLAGS, which replaces the wasm flags in .cargo/config.toml.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build and package
        run: just release-files 0.0.0-latest
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        # --latest makes it the release GitHub reports as the latest, which `just language-install` downloads.
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --latest --title "Latest build" \
              --notes "Built from ${GITHUB_SHA}. Replaced on every push to main."
          else
            gh release create latest --latest --title "Latest build" \
              --notes "Built from ${GITHUB_SHA}. Replaced on every push to main."
          fi
          gh release upload latest dist/harper-de.wasm dist/harper-de.wasm.sha256 --clobber
