name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # It would set RUSTFLAGS, which replaces the wasm flags in .cargo/config.toml.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: just check
      - run: just test

  plugin:
    # Builds the real module and loads it through harper-plugin-host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # It would set RUSTFLAGS, which replaces the wasm flags in .cargo/config.toml.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: just test-plugin
